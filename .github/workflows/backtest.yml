name: Daily Draft Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Run Script
        env:
          DISCORD_WEBHOOK_GENG: ${{ secrets.DISCORD_WEBHOOK_GENG }}
        run: python draft_script.py
